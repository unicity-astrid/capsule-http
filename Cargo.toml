[package]
name = "astrid-capsule-http"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "HTTP fetch tool for Astrid agents"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Requires the per-request timeout API (`Request::timeout` → @1.1.0
# `request-options`/`total-ms`), added after astrid-sdk 0.7.0 — needs the 0.8
# release. v0.7 has no caller-side timeout knob on the buffered path.
astrid-sdk = { version = "0.8", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
