[package]
name = "astrid-capsule-http"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "HTTP fetch tool for Astrid agents"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Requires the per-request timeout API (`Request::timeout` -> @1.1.0
# `request-options`/`total-ms`). Pin to the SDK 0.8.0 release commit until
# astrid-sdk 0.8.0 is published on crates.io.
astrid-sdk = { git = "https://github.com/unicity-astrid/sdk-rust.git", rev = "afaf3f6e6b49d6b8e101c75a5138ae7e55a1de28", version = "0.8.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
