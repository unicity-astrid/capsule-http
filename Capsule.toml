[package]
name = "astrid-capsule-http"
version = "0.1.0"
description = "HTTP fetch tool for Astrid agents"
authors = ["Joshua J. Bouw <dev@joshuajbouw.com>", "Unicity Labs <info@unicity-labs.com>"]
astrid-version = ">=0.1.0"

[[component]]
id = "http-tools"
file = "astrid_capsule_http.wasm"
type = "executable"

[capabilities]
net = ["*"]

[publish]
"tool.v1.execute.*.result" = { wit = "TODO" }
"tool.v1.response.describe.*" = { wit = "TODO" }

[subscribe]
"tool.v1.execute.fetch_url" = { wit = "TODO", handler = "tool_execute_fetch_url" }
"tool.v1.request.describe" = { wit = "TODO", handler = "tool_describe" }
